[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auditabr"
version = "0.2.0"
description = "Observatório eleitoral local com proveniência e qualidade explícitas"
requires-python = ">=3.12"
dependencies = ["duckdb", "polars", "pyarrow", "fastapi", "uvicorn", "streamlit", "plotly", "typer", "httpx", "pyyaml", "py7zr", "tzdata"]

[project.scripts]
auditabr = "auditabr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditabr = ["resources/*.sql", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "AUDITA_BR/tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

